{% extends "base.html" %}

{% block title %}Ajouter un compte bancaire - SyLoc{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Ajouter un compte bancaire</h1>
    <a href="{% url 'rental:bank_account_list' %}" class="btn btn-secondary btn-with-icon"><span class="app-nav-icon" aria-hidden="true">{% include "includes/nav_icon.html" with icon="arrow_left" %}</span><span>Retour</span></a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Créer</button>
        </form>
    </div>
</div>
{% endblock %}
