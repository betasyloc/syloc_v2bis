{% extends "base.html" %}

{% block title %}Mot de passe modifié - SyLoc{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <h1>Mot de passe modifié</h1>
        <p class="subtitle">Votre mot de passe a bien été réinitialisé. Vous pouvez maintenant vous connecter.</p>
        <div class="form-actions" style="margin-top: 1.5rem;">
            <a href="{% url 'login' %}" class="btn btn-primary btn-with-icon"><span class="app-nav-icon" aria-hidden="true">{% include "includes/nav_icon.html" with icon="login" %}</span><span>Se connecter</span></a>
        </div>
    </div>
</div>
{% endblock %}
