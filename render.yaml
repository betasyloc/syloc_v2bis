# Blueprint Render – SyLoc
# Déploiement : connecter ce dépôt à Render puis créer le Blueprint.
# Voir DEPLOIEMENT.md pour les étapes détaillées.

databases:
  - name: syloc-db
    plan: free

services:
  - type: web
    name: syloc
    runtime: python
    plan: free

    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    # sync_plan_stripe_prices : copie STRIPE_PRICE_ID_* (env Render) vers les Plans en base — pas d’effet si les variables sont vides.
    startCommand: "python manage.py migrate && python manage.py sync_plan_stripe_prices && gunicorn immo_saas.wsgi:application"

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SYLOC_SUBSCRIPTION_SANDBOX
        value: "true"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SESSION_COOKIE_AGE
        value: "43200"
      - key: SESSION_EXPIRE_AT_BROWSER_CLOSE
        value: "true"
      # SMTP (emails réels) : renseigner dans le dashboard Render (Environment)
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: syloc-db
          property: connectionString
      # Renseigner sur Render (Dashboard → Environment) après la première URL du service :
      - key: RENDER_EXTERNAL_URL
        sync: false
      # Stripe : à remplir dans le dashboard (ne pas commiter de secrets).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_BASE
        sync: false
      - key: STRIPE_PRICE_ID_BASE_ANNUAL
        sync: false
      - key: STRIPE_PRICE_ID_PREMIUM
        sync: false
      - key: STRIPE_PRICE_ID_PREMIUM_ANNUAL
        sync: false
